<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Glass Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Floating Background Glass Blobs -->
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Main Liquid Glass Calculator Frame -->
    <main class="calculator-wrapper">
        <div class="glass-calculator">
            <!-- Header Bar -->
            <header class="calculator-header">
                <span class="brand-badge">LIQUID GLASS</span>
                <div class="header-actions">
                    <button class="icon-btn" id="history-toggle" title="Calculation History">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    </button>
                    <button class="icon-btn" id="theme-toggle" title="Toggle Glass Theme">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                    </button>
                </div>
            </header>

            <!-- Screen Display -->
            <section class="display-container">
                <div class="expression-display" id="expression"></div>
                <div class="main-display" id="display">0</div>
            </section>

            <!-- Keypad Buttons -->
            <section class="keypad">
                <button class="btn btn-func" data-action="clear">AC</button>
                <button class="btn btn-func" data-action="delete">⌫</button>
                <button class="btn btn-func" data-action="percent">%</button>
                <button class="btn btn-op" data-action="divide">÷</button>

                <button class="btn" data-number="7">7</button>
                <button class="btn" data-number="8">8</button>
                <button class="btn" data-number="9">9</button>
                <button class="btn btn-op" data-action="multiply">×</button>

                <button class="btn" data-number="4">4</button>
                <button class="btn" data-number="5">5</button>
                <button class="btn" data-number="6">6</button>
                <button class="btn btn-op" data-action="subtract">−</button>

                <button class="btn" data-number="1">1</button>
                <button class="btn" data-number="2">2</button>
                <button class="btn" data-number="3">3</button>
                <button class="btn btn-op" data-action="add">+</button>

                <button class="btn btn-func" data-action="negate">±</button>
                <button class="btn" data-number="0">0</button>
                <button class="btn" data-number=".">.</button>
                <button class="btn btn-equals" data-action="equals">=</button>
            </section>

            <!-- Slide-in History Panel -->
            <div class="history-panel" id="history-panel">
                <div class="history-header">
                    <h3>History</h3>
                    <div class="history-header-actions">
                        <button class="text-btn" id="clear-history">Clear</button>
                        <button class="icon-btn close-btn" id="history-close" title="Close History">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="history-list" id="history-list">
                    <p class="empty-history">No calculations yet</p>
                </div>
            </div>
        </div>

        <!-- Stylish Credit -->
        <p class="creator-credit">
            Crafted with <span class="heart">♥</span> by <span class="creator-name">codewithrizi</span>
        </p>
    </main>

    <script src="script.js"></script>
</body>
</html>
